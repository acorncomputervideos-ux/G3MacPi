# Builds the portable emulator core on Linux and runs all unit tests.
name: host-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = clang ]; then export CXX=clang++; else export CXX=g++; fi
          cmake -S . -B build/host -DG3_SANITIZE=ON

      - name: Build
        run: cmake --build build/host -j"$(nproc)"

      - name: Unit tests
        run: ./build/host/g3_unit_tests

      - name: DingusPPC CPU test suite (vs. baseline)
        run: tools/run-dppc-cpu-tests.sh build/host/dppc_cpu_tests build/dppc_cpu_tests.log

      - name: Upload DingusPPC CPU test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dppc-cpu-tests-${{ matrix.compiler }}
          path: build/dppc_cpu_tests.log

      - name: Core portability rules
        run: tools/check-core.sh
